<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kageshwori Water ERP | Secure Login</title>
  <meta name="description" content="Kageshwori Mineral Water Industries Limited ERP">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #edf4f8;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
      background: #edf4f8;
    }

    .setup-message {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #183a52;
      background: #edf4f8;
    }

    .setup-message.visible {
      display: flex;
    }

    .setup-card {
      width: min(480px, 100%);
      padding: 30px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(13, 43, 65, 0.1);
    }

    .setup-card a {
      color: #0a6c9a;
    }
  </style>
</head>

<body>
  <iframe
    id="erpApp"
    class="app-frame"
    title="Kageshwori Water ERP Login"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="setupMessage" class="setup-message" role="status">
    <div class="setup-card">
      <h2>ERP Login Setup Required</h2>
      <p>
        Apps Script को नयाँ Web App Deployment बाट प्राप्त
        /exec URL index.html मा राख्नुहोस्।
      </p>
    </div>
  </div>

  <script>
    'use strict';

    // Replace this value with your deployed Apps Script Web App /exec URL.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygaPd5kMTvfanz5kWlef0rb6snJA7JtHAkeSOZgaL5s0zO7dDL51vxxS96rJDN5yc9Vw/exec';

    const frame = document.getElementById('erpApp');
    const setupMessage = document.getElementById('setupMessage');

    const validUrl =
      /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(
        APPS_SCRIPT_URL
      );

    if (validUrl) {
      frame.src = APPS_SCRIPT_URL;
    } else {
      frame.hidden = true;
      setupMessage.classList.add('visible');
    }

    // The Apps Script page displays its own actual database connection status.
    // An iframe load event alone is NOT treated as proof of server connectivity.
  </script>
</body>
</html>
