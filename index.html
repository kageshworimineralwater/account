<!doctype html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kageshwori Water ERP | Accounting & Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b2544;
      --navy-light: #163b63;
      --blue: #1266d4;
      --aqua: #0bb8c7;
      --background: #f3f7fc;
      --surface: #fff;
      --text: #182c45;
      --muted: #6e7e91;
      --border: #dce5ef;
      --danger: #c33c42;
      --radius: 15px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--background); font-family: Inter, 'Noto Sans Devanagari', sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 248px; flex: none; background: var(--navy); color: #e7f0ff; padding: 22px 14px; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 10px 25px; border-bottom: 1px solid #ffffff22; margin-bottom: 16px; }
    .brand-icon { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, #11d6d2, #1575ed); display: grid; place-items: center; font-size: 26px; }
    .brand strong { display: block; font-size: 14px; }
    .brand small { color: #b8cbe3; font-size: 11px; }
    .nav { width: 100%; text-align: left; border: 0; color: #d1e0f4; background: transparent; padding: 12px 14px; border-radius: 10px; margin: 3px 0; }
    .nav:hover, .nav.active { background: #ffffff1c; color: white; }
    .main { flex: 1; min-width: 0; }
    header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 21px 30px; border-bottom: 1px solid var(--border); gap: 10px; }
    header h1 { font-size: 19px; margin: 0; }
    header small { color: var(--muted); }
    .content { max-width: 1260px; margin: 0 auto; padding: 28px; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 24px; }
    .card, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 6px 22px #18375a08; }
    .card { padding: 22px; }
    .card span { color: var(--muted); font-size: 12px; }
    .card strong { display: block; font-size: 26px; margin-top: 10px; color: var(--navy); }
    .panel { padding: 25px; margin-bottom: 20px; }
    .panel h2 { margin: 0 0 8px; font-size: 19px; }
    .hint { font-size: 12px; color: var(--muted); margin: 0 0 18px; line-height: 1.8; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 7px; }
    input, select, textarea { width: 100%; border: 1px solid #cdd9e7; border-radius: 9px; padding: 12px; background: white; color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: 2px solid #b4d6ff; border-color: var(--blue); }
    .field-wide { grid-column: 1 / -1; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
    .btn { border: none; padding: 11px 18px; border-radius: 9px; background: var(--blue); color: white; font-weight: 700; }
    .btn.secondary { background: #e9f1fc; color: var(--navy); }
    .btn:disabled { opacity: .5; cursor: wait; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); background: #f8fbff; }
    .notice { padding: 13px 16px; border-radius: 10px; background: #eaf3ff; color: #174f88; margin-bottom: 18px; font-size: 13px; }
    .notice.error { background: #fff0f0; color: var(--danger); }
    .login { max-width: 440px; margin: 11vh auto; }
    .login .panel { padding: 32px; }
    .hide { display: none !important; }
    .status { font-size: 12px; color: var(--muted); }
    .tag { background: #dff6f3; color: #147569; padding: 5px 10px; border-radius: 20px; font-size: 11px; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } .sidebar { width: 205px; } }
    @media (max-width: 640px) {
      .layout { display: block; } .sidebar { width: 100%; padding: 12px; }
      .brand { margin-bottom: 7px; padding-bottom: 10px; }
      #navigation { display: flex; overflow-x: auto; gap: 5px; }
      .nav { white-space: nowrap; width: auto; font-size: 12px; }
      header { padding: 15px; } .content { padding: 14px; }
      .cards, .form-grid { grid-template-columns: 1fr; }
      .panel { padding: 17px; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login">
    <section class="panel">
      <div class="brand-icon">💧</div>
      <h2>Kageshwori Water ERP</h2>
      <p class="hint">कागेश्वरी मिनरल वाटर इन्डष्ट्रिज लिमिटेड<br>Secure Accounting System</p>
      <form id="loginForm">
        <p><label for="username">Username</label><input id="username" required autocomplete="username"></p>
        <p><label for="password">Password</label><input id="password" required type="password" autocomplete="current-password"></p>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p class="status" id="connection">Connecting to Apps Script...</p>
    </section>
  </div>
  <div id="app" class="layout hide">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">💧</div><div><strong>Kageshwori Water</strong><small>ERP & Accounting</small></div></div>
      <nav id="navigation"></nav>
    </aside>
    <main class="main">
      <header><div><h1 id="pageTitle">Dashboard</h1><small>Production · Inventory · Accounting</small></div><button class="btn secondary" id="logout">Logout</button></header>
      <div class="content"><div id="notice" class="notice hide"></div><div id="view"></div></div>
    </main>
  </div>
  <iframe id="bridge" title="Secure Apps Script bridge" style="display:none"></iframe>
  <script>
    'use strict';

    // REQUIRED CONFIGURATION: paste your deployed Apps Script /exec URL.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrblxG9rVhhFi4DJmHjTrvNMJpG2510wGEkLcOrVcV0zT8ilM09q2WjxDtj7mpZV-d5Q/exec';
    const SCRIPT_ORIGIN = 'https://script.google.com';
    const pages = [
      ['dashboard', '▦ Dashboard'], ['customers', '♙ Customers'],
      ['products', '◈ Products'], ['vehicles', '▣ Vehicles'],
      ['production', '⚙ Production'], ['sales', '▤ Sales / VAT Invoice'],
      ['returns', '↩ Empty Jar Return'], ['receipts', '৳ Customer Receipt'],
      ['expenses', '▧ Expenses'], ['loads', '⇄ Vehicle Load'],
      ['settlements', '✓ Vehicle Settlement'], ['ledger', '☷ Ledger'],
      ['records', '≡ Transaction Records'], ['userAccess', '♙ User Access']
    ];
    const state = { token: '', role: '', permissions: [], ready: false, current: 'dashboard', masters: null, pending: new Map(), seq: 0 };
    const $ = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits:2});
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const options = (rows, idKey, nameKey) => '<option value="">Select...</option>' +
      (rows || []).map(row => `<option value="${escapeHtml(row[idKey])}">${escapeHtml(row[nameKey] || row[idKey])}</option>`).join('');

    function notify(message, error = false) {
      const el = $('notice'); el.textContent = message;
      el.className = 'notice' + (error ? ' error' : '');
    }

    // The bridge is a Google-hosted Apps Script HTML page. It forwards
    // authenticated requests via google.script.run; no public JSONP endpoints.
    function request(action, data = {}) {
      if (!state.ready) return Promise.reject(Error('Backend not connected. Check deployment URL.'));
      return new Promise((resolve, reject) => {
        const id = ++state.seq;
        const timeout = setTimeout(() => {
          state.pending.delete(id);
          reject(Error('Request timed out. Please verify transaction before retrying.'));
        }, 45000);
        state.pending.set(id, {resolve, reject, timeout});
        $('bridge').contentWindow.postMessage({kind:'ERP_REQUEST',id,
          payload:{action,data,token:state.token}},SCRIPT_ORIGIN);
      });
    }

    window.addEventListener('message', event => {
      if (event.origin !== SCRIPT_ORIGIN || event.source !== $('bridge').contentWindow) return;
      if (event.data?.kind === 'ERP_READY') {
        state.ready = true;
        $('connection').textContent = 'Secure connection ready';
      }
      if (event.data?.kind !== 'ERP_RESPONSE') return;
      const pending = state.pending.get(event.data.id);
      if (!pending) return;
      clearTimeout(pending.timeout);
      state.pending.delete(event.data.id);
      if (event.data.error) pending.reject(Error(event.data.error));
      else if (event.data.result?.ok === false) pending.reject(Error(event.data.result.error));
      else pending.resolve(event.data.result?.data);
    });

    if (APPS_SCRIPT_URL.startsWith('https://script.google.com/macros/s/')) {
      $('bridge').src = APPS_SCRIPT_URL;
    } else {
      $('connection').textContent = 'Configure APPS_SCRIPT_URL in index.html';
    }

    $('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const data = await request('login', {username:$('username').value,password:$('password').value});
        state.token = data.token;
        state.role = data.role;
        state.permissions = data.permissions || [];
        renderNavigation();
        $('password').value = '';
        state.masters = await request('bootstrap');
        $('loginScreen').classList.add('hide');
        $('app').classList.remove('hide');
        navigate(state.permissions.includes('dashboard') ? 'dashboard' : (state.permissions[0] || 'userAccess'));
      } catch (error) { $('connection').textContent = error.message; }
    });

    $('logout').addEventListener('click', async () => {
      try { await request('logout'); } catch (_) { /* session may have expired */ }
      state.token = '';
      state.role = '';
      state.permissions = [];
      renderNavigation();
      $('app').classList.add('hide');
      $('loginScreen').classList.remove('hide');
    });

    function renderNavigation() {
      $('navigation').innerHTML = pages.filter(([id]) =>
        id === 'userAccess' ? state.role === 'Super Admin' :
        state.permissions.includes(id)).map(([id,title]) =>
        `<button class="nav" data-page="${id}">${title}</button>`).join('');
    }
    $('navigation').addEventListener('click', event => {
      const button = event.target.closest('[data-page]');
      if (button) navigate(button.dataset.page);
    });

    function navigate(page) {
      if (page === 'userAccess' && state.role !== 'Super Admin') return;
      if (page !== 'userAccess' && !state.permissions.includes(page)) return;
      state.current = page;
      $('pageTitle').textContent = pages.find(p => p[0] === page)?.[1] || page;
      document.querySelectorAll('.nav').forEach(button =>
        button.classList.toggle('active',button.dataset.page === page));
      $('notice').classList.add('hide');
      if (page === 'userAccess') return userAccess();
      if (page === 'dashboard') return dashboard();
      if (page === 'records') return records();
      if (page === 'ledger') return ledgerForm();
      renderForm(page);
    }

    async function userAccess() {
      const result = await request('manageUsers', {command:'list'});
      const entries = Object.entries(result.available);
      const users = result.users;
      $('view').innerHTML = `
        <section class="panel"><h2>Super Admin — Account Management</h2>
          <p class="hint">Accounts are read from the Google Sheet User tab. Inactive users lose access immediately.</p>
          <form id="createAccount">
            ${field('newUsername','New username')}
            ${field('newPassword','Password (minimum 12 characters)','password')}
            <label>Account Type</label><select name="role"><option>Admin</option><option>Super Admin</option></select>
            <p><button class="btn">Create account</button></p>
          </form></section>
        <section class="panel"><h2>Existing accounts</h2>
          ${users.map(u => `<div class="panel" style="margin-bottom:12px">
            <strong>${escapeHtml(u.username)}</strong> — ${escapeHtml(u.role)}
            <span class="hint">(${escapeHtml(u.status)})</span>
            <div style="margin:12px 0">
              <button class="btn secondary" data-toggle="${escapeHtml(u.username)}" data-status="${u.status==='Active'?'Inactive':'Active'}">${u.status==='Active'?'Deactivate':'Activate'}</button>
              <button class="btn secondary" data-password="${escapeHtml(u.username)}">Reset password</button>
            </div>
            ${u.role==='Admin' ? `<div class="form-grid">${entries.map(([key,label])=>
              `<label><input type="checkbox" data-perm="${escapeHtml(u.username)}" value="${key}" ${u.permissions.includes(key)?'checked':''}> ${escapeHtml(label)}</label>`).join('')}</div>
              <button class="btn" data-save="${escapeHtml(u.username)}">Save permissions</button>` : '<p class="hint">Super Admin: full access.</p>'}
          </div>`).join('')}
        </section>`;
      $('createAccount').addEventListener('submit', async e => {
        e.preventDefault();
        const form = e.currentTarget;
        try {
          await request('manageUsers',{command:'create',username:form.newUsername.value.trim(),
            password:form.newPassword.value,role:form.role.value});
          notify('Account created.'); await userAccess();
        } catch(err) { notify(err.message,true); }
      });
      $('view').querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=async()=>{
        try {await request('manageUsers',{command:'status',username:btn.dataset.toggle,status:btn.dataset.status});await userAccess();}
        catch(err){notify(err.message,true);}
      });
      $('view').querySelectorAll('[data-password]').forEach(btn=>btn.onclick=async()=>{
        const password=prompt('Enter new password (12+ characters) for '+btn.dataset.password);
        if(password===null)return;
        try {await request('manageUsers',{command:'password',username:btn.dataset.password,password});notify('Password updated.');}
        catch(err){notify(err.message,true);}
      });
      $('view').querySelectorAll('[data-save]').forEach(btn=>btn.onclick=async()=>{
        const username=btn.dataset.save;
        const permissions=[...$('view').querySelectorAll('[data-perm]')]
          .filter(el=>el.dataset.perm===username && el.checked).map(el=>el.value);
        try {await request('manageUsers',{command:'permissions',username,permissions});notify('Permissions updated.');await userAccess();}
        catch(err){notify(err.message,true);}
      });
    }

    async function dashboard() {
      $('view').innerHTML = '<div class="panel">Loading dashboard...</div>';
      try {
        const d = await request('dashboard');
        const cards = [
          ['कुल उत्पादन',fmt(d.producedQty)],['कुल बिक्री','रु. '+fmt(d.salesAmount)],
          ['प्राप्त रकम','रु. '+fmt(d.receiptAmount)],['खर्च','रु. '+fmt(d.expenseAmount)],
          ['Sales Invoices',fmt(d.invoiceCount)],['Customers',fmt(d.customerCount)]
        ];
        $('view').innerHTML = `<div class="notice">${escapeHtml(d.warning)}</div><div class="cards">`+
          cards.map(([label,value])=>`<div class="card"><span>${label}</span><strong>${value}</strong></div>`).join('')+
          '</div><div class="panel"><h2>Accounting Control</h2><p class="hint">Posted transactions are included. Opening balances, VAT compliance, stock costing and detailed financial statements require reconciliation before production use.</p></div>';
      } catch (error) { notify(error.message,true); }
    }

    const field = (name,label,type='text',extra='') =>
      `<div><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" ${extra}></div>`;
    const select = (name,label,items) =>
      `<div><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}" required>${items}</select></div>`;
    const masters = () => state.masters || {customers:[],products:[],vehicles:[],accounts:[]};

    function renderForm(page) {
      const m=masters();
      const customer=()=>select('customerId','ग्राहक / Customer',options(m.customers,'CustomerID','NameEN'));
      const product=()=>select('productId','उत्पादन / Product',options(m.products,'ProductID','ProductName'));
      const vehicle=()=>select('vehicleId','गाडी / Vehicle',options(m.vehicles,'VehicleID','Number'));
      const qty=()=>field('quantity','Quantity','number','required min="0.001" step="any"');
      const amount=()=>field('amount','Amount (NPR)','number','required min="0.01" step="0.01"');
      const mode=()=>select('mode','Payment mode','<option value="CASH">Cash</option><option value="BANK">Bank</option>');
      const forms={
        customers:{action:'saveMaster',title:'Add Customer',fields:field('NameEN','Customer name','text','required')+field('NameNE','नेपाली नाम')+field('Mobile','Mobile')+field('Address','Address')+field('PAN','PAN / VAT')+field('CreditLimit','Credit limit','number','min="0"'),sheet:'Customers'},
        products:{action:'saveMaster',title:'Add Product',fields:field('ProductName','Product name','text','required')+field('SizeML','Size (ml)','number')+field('Unit','Unit')+field('ProductCategory','Category')+field('DefaultRate','Default rate','number','min="0" step="0.01"')+field('TaxCode','Tax code'),sheet:'Products'},
        vehicles:{action:'saveMaster',title:'Add Vehicle',fields:field('Number','Vehicle number','text','required')+field('DriverID','Driver ID')+select('Ownership','Ownership','<option value="Company">Company</option><option value="External">External</option>'),sheet:'Vehicles'},
        production:{action:'production',title:'Daily Production',fields:product()+qty()+field('rejectQty','Rejected quantity','number','min="0"')+field('notes','Notes')},
        sales:{action:'sale',title:'Sales / VAT Invoice',fields:customer()+product()+qty()+field('rate','Rate (blank = price rule)','number','min="0" step="0.01"')+
          select('saleType','Sale type','<option value="RETURNABLE">Returnable jar water</option><option value="FILLING">Customer jar filling</option><option value="JAR_SALE">New jar sale</option><option value="STANDARD">Other packaged water</option>')+
          field('jarTypeId','Jar Type ID (required for returnable)')+field('loadId','Vehicle Load ID (optional)')+field('vehicleId','Vehicle ID (optional)')+
          field('taxRate','VAT %','number','value="13" min="0" max="100"')+
          select('taxInclusive','Rate type','<option value="false">VAT exclusive</option><option value="true">VAT inclusive</option>')},
        returns:{action:'jarReturn',title:'Empty Jar Return',fields:customer()+field('jarTypeId','Jar Type ID','text','required')+qty()},
        receipts:{action:'receipt',title:'Customer Receipt',fields:customer()+amount()+mode()},
        expenses:{action:'expense',title:'Expense Voucher',fields:field('description','Expense description','text','required')+field('categoryId','Expense category ID')+amount()+mode()},
        loads:{action:'vehicleLoad',title:'Vehicle Load',fields:vehicle()+product()+qty()},
        settlements:{action:'vehicleSettlement',title:'Vehicle Settlement',fields:field('loadId','Load ID','text','required')+
          field('unsoldQty','Unsold full jars returned','number','required min="0"')+
          field('emptyJarCollected','Empty jars collected (reference only)','number','min="0"')+
          field('cashCollected','Cash reported (reconciliation only)','number','min="0"')+
          field('bankCollected','Bank reported (reconciliation only)','number','min="0"')}
      };
      const f=forms[page];
      if(!f) return;
      const caution=page==='settlements' ? 'Settlement reconciles invoices; it does not automatically create customer receipts or post empty-jar movements. Record these separately.' :
        page==='sales' ? 'VAT rate and pricing must be checked. This initial version does not perform stock availability or cost-of-sales posting.' :
        page==='production' ? 'Production entry does not yet deduct caps, labels or empty jars automatically.' : '';
      $('view').innerHTML=`<section class="panel"><h2>${f.title}</h2><p class="hint">Entries are written to your existing Google Sheets database. Posted records are not edited here.</p>`+
        (caution?`<div class="notice">${escapeHtml(caution)}</div>`:'')+
        `<form id="entryForm"><div class="form-grid">${f.fields}</div><div class="actions"><button class="btn" type="submit">Save transaction</button><button class="btn secondary" type="reset">Clear</button></div></form></section>`;
      $('entryForm').addEventListener('submit',async event=>{
        event.preventDefault();
        const button=event.target.querySelector('button[type="submit"]');
        const raw=Object.fromEntries(new FormData(event.target).entries());
        const data=f.sheet?{sheet:f.sheet,record:raw}:raw;
        if(page==='sales') data.taxInclusive=raw.taxInclusive==='true';
        button.disabled=true;
        try {
          const result=await request(f.action,data);
          notify('Saved successfully: '+(result.id||result.InvoiceID||result.CustomerID||result.ProductID||result.VehicleID));
          event.target.reset();
          if(f.sheet) state.masters=await request('bootstrap');
        } catch(error) { notify(error.message,true); }
        finally { button.disabled=false; }
      });
    }

    async function records() {
      const sheets=['Sales_Invoices','Production_Daily','Jar_Movements','Receipts','Expenses','Vehicle_Loads','Vehicle_Settlements','Vouchers'];
      $('view').innerHTML=`<div class="panel"><h2>Transaction Records</h2><div class="form-grid">`+
        select('recordSheet','Choose table',sheets.map(s=>`<option value="${s}">${s}</option>`).join(''))+
        `</div><div class="actions"><button class="btn" id="loadRecords">Load Records</button></div><div id="recordResult" class="table-wrap"></div></div>`;
      $('loadRecords').onclick=async()=>{
        try { const rows=await request('list',{sheet:$('f_recordSheet').value}); renderTable($('recordResult'),rows); }
        catch(error){notify(error.message,true);}
      };
    }

    function ledgerForm() {
      $('view').innerHTML=`<div class="panel"><h2>General Ledger</h2><p class="hint">Posted journal lines only. Opening balances are not included in this preview.</p><div class="form-grid">`+
        select('accountId','Account',options(masters().accounts,'AccountID','AccountNameEN'))+
        field('partyId','Customer/Supplier ID (optional)')+
        `</div><div class="actions"><button class="btn" id="loadLedger">Show Ledger</button></div><div id="ledgerSummary"></div><div id="ledgerResult" class="table-wrap"></div></div>`;
      $('loadLedger').onclick=async()=>{
        try {
          const d=await request('ledger',{accountId:$('f_accountId').value,partyId:$('f_partyId').value});
          $('ledgerSummary').textContent=`Debit: ${fmt(d.totalDr)} | Credit: ${fmt(d.totalCr)} | Dr-Cr: ${fmt(d.balance)}`;
          renderTable($('ledgerResult'),d.lines);
        } catch(error){notify(error.message,true);}
      };
    }

    function renderTable(container,rows) {
      if(!rows.length) {container.innerHTML='<p class="hint">No records found.</p>';return;}
      const keys=Object.keys(rows[0]);
      container.innerHTML='<table><thead><tr>'+keys.map(k=>`<th>${escapeHtml(k)}</th>`).join('')+
        '</tr></thead><tbody>'+rows.map(row=>'<tr>'+keys.map(k=>`<td>${escapeHtml(row[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
    }
  </script>
</body>
</html>
